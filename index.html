function exportProgress(){let payload={app:'wordflow-study-site',version:1,exportedAt:new Date().toISOString(),progress:progress()};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`wordflow-backup-${isoToday()}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
function importProgress(input){let file=input.files&&input.files[0];input.value='';if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let parsed=JSON.parse(reader.result),p=parsed?.app==='wordflow-study-site'?parsed.progress:parsed;if(!p||typeof p!=='object'||!p.days||typeof p.days!=='object')throw Error('형식');let days={};for(let [k,v] of Object.entries(p.days)){let n=Number(k);if(Number.isInteger(n)&&n>=1&&n<=24&&/^\d{4}-\d{2}-\d{2}$/.test(v))days[n]=v}let last=null;if(p.last&&Number.isInteger(Number(p.last.day))&&Number(p.last.day)>=1&&Number(p.last.day)<=24&&/^\d{4}-\d{2}-\d{2}$/.test(p.last.date))last={day:Number(p.last.day),date:p.last.date};let wordStatus={};if(p.wordStatus&&typeof p.wordStatus==="object")for(let[k,v]of Object.entries(p.wordStatus))if(v==="known"||v==="unknown")wordStatus[k]=v;let current=null;if(p.current&&Number.isInteger(Number(p.current.day))&&Number(p.current.day)>=1&&Number(p.current.day)<=24&&Array.isArray(p.current.order)&&p.current.order.every(w=>typeof w==='string'))current={day:Number(p.current.day),index:Math.max(0,Math.min(Number(p.current.index)||0,p.current.order.length-1)),order:p.current.order,revealed:!!p.current.revealed,mode:["all","known","unknown"].includes(p.current.mode)?p.current.mode:"all"};if(!Object.keys(days).length&&!last&&!current)throw Error('빈 기록');if(!confirm('이 기기의 현재 복습 기록을 선택한 백업 파일의 기록으로 바꿀까요?'))return;localStorage.setItem(KEY,JSON.stringify({days,wordStatus,...(last?{last}:{}),...(current?{current}:{})}));alert('복습 기록을 가져왔어요.');home()}catch{alert('Wordflow 백업 JSON 파일을 확인해 주세요. 파일 내용이 올바르지 않거나 복습 기록이 없어요.')}};reader.onerror=()=>alert('파일을 읽지 못했어요.');reader.readAsText(file,'utf-8')}
function frame(s){app.innerHTML=`<header class="top"><div class="brand"><span class="mark">W</span> WORDFLOW</div><div class="tagline">오늘의 단어를 차근차근</div></header><main class="wrap">${s}<div class="footer">학습 기록은 이 브라우저에 저장됩니다.</div></main>`}
function defs(x){let base=x.defs.map(a=>`<span class="pos ${a.estimated?'guess':''}">${esc(a.pos)}${a.estimated?' · 추정':''}</span> ${a.meanings.map(esc).join(', ')}`).join('<br>'),syn=x.synonyms||[],rel=x.related||[],groups=[];if(syn.length)groups.push(`<div class="related-group"><span class="related-label">유사어</span>${syn.map(a=>`<span class="related-item"><span class="related-term">${esc(a.term)}</span>${a.meaning?` <span class="related-meaning">· ${esc(a.meaning)}</span>`:''}</span>`).join('')}</div>`);if(rel.length)groups.push(`<div class="related-group"><span class="related-label">관련어 · 함께 나온 표현</span>${rel.map(a=>`<span class="related-item"><span class="related-term">${esc(a.term)}</span>${a.meaning?` <span class="related-meaning">· ${esc(a.meaning)}</span>`:''}</span>`).join('')}</div>`);return base+(groups.length?`<div class="related">${groups.join('')}</div>`:'')}
function home(){clearCardTimers();page='home';let p=progress(),last=p.current?`진행 중: <b>Day ${p.current.day} · ${p.current.index+1}번째 단어부터 이어서 학습할 수 있어요.</b>`:p.last?`마지막 회독: <b>${dateLabel(p.last.date)} · Day ${p.last.day}</b>`:'아직 회독 기록이 없습니다. Day를 완료하면 여기에 저장됩니다.';frame(`<section class="view"><div class="hero"><div><div class="eyebrow">WORDFLOW · DAILY REVIEW</div><h1>단어를 하나씩,<br>내 것으로.</h1><p>아는 단어는 목록으로 살펴보고, 모르는 단어는 고정된 섞기 순서로 하루씩 복습해요.</p></div><div class="total"><b>${(D.knownCount+D.unknownCount).toLocaleString()}</b><small>전체 단어</small></div></div><div class="choices"><button class="choice" onclick="knownPage()"><span class="icon">✓</span><h2>아는 단어</h2><p>기존에 알고 있는 ${D.knownCount.toLocaleString()}개</p><strong>전체 목록 보기　→</strong></button><button class="choice unknown" onclick="daysPage()"><span class="icon">✦</span><h2>모르는 단어</h2><p>${D.unknownCount.toLocaleString()}개 · 24 Days</p><strong>${p.current?'이어 학습하기　→':'Day 선택하기　→'}</strong></button></div><div class="last"><span class="dot"></span><span>${last}</span></div><div class="backup"><div class="backup-copy"><b>복습 기록 백업</b><span>JSON 파일로 내보내 다른 기기에서 가져올 수 있어요.</span></div><div class="backup-actions"><button class="btn soft" onclick="exportProgress()">기록 내보내기</button><button class="btn" onclick="document.getElementById('backup-file').click()">기록 가져오기</button><input class="file-input" id="backup-file" type="file" accept=".json,application/json" onchange="importProgress(this)"></div></div></section>`)}
function knownPage(){clearCardTimers();page='known';query='';frame(`<section class="view"><button class="back" onclick="home()">← 시작화면</button><div class="head"><div><div class="eyebrow">KNOWN WORDS</div><h1>아는 단어</h1><p>기존에 알고 있는 단어를 모두 나열했습니다.</p></div><input class="search" id="search" placeholder="단어 또는 뜻 검색" oninput="updateKnown(this.value)"></div><div class="summary"><span>전체 ${D.knownCount.toLocaleString()}개</span><span id="shown"></span></div><div class="list" id="known-list"></div></section>`);updateKnown('')}
function updateKnown(q){query=q;let list=D.known.filter(x=>!q||x.word.toLowerCase().includes(q.toLowerCase())||x.defs.some(a=>a.meanings.join(' ').toLowerCase().includes(q.toLowerCase())));document.getElementById('shown').textContent=`현재 ${list.length.toLocaleString()}개 표시`;document.getElementById('known-list').innerHTML=list.length?list.map(x=>`<article class="row"><div class="word">${esc(x.word)}</div><div class="meaning">${defs(x)}</div></article>`).join(''):'<div class="empty">검색 결과가 없습니다.</div>'}
function daysPage(){clearCardTimers();page='days';let p=progress(),status=p.wordStatus||{};frame(`<section class="view"><button class="back" onclick="home()">← 시작화면</button><div class="head"><div><div class="eyebrow">UNKNOWN WORDS · 24 DAYS</div><h1>모르는 단어</h1><p>Day를 고른 뒤 전체 단어, 아는 단어만, 모르는 단어만 복습할 수 있어요. 아직 분류하지 않은 단어는 모르는 단어 복습에 포함됩니다.</p></div><div class="total"><b>${D.unknownCount.toLocaleString()}</b><small>단어</small></div></div><div class="days">${D.days.map((a,i)=>{let n=i+1,last=p.days?.[n],active=p.current?.day===n,known=a.filter(x=>status[x.word]==='known').length;return `<button class="day" onclick="chooseDay(${i})"><small>DAY ${String(n).padStart(2,'0')}</small><b>${a.length}개 단어</b><span>${known}개 아는 단어 · ${a.length-known}개 복습 대상</span><em>${active?'이어하기 · 방식 선택 →':'학습 방식 선택 →'}</em>${last?`<span class="day-last">최근 복습 · ${dateLabel(last)}</span>`:''}</button>`}).join('')}</div><div class="mode-overlay" id="mode-overlay" hidden></div></section>`)}
function chooseDay(i){let p=progress(),words=D.days[i],status=p.wordStatus||{},known=words.filter(x=>status[x.word]==='known').length,unknown=words.length-known,overlay=document.getElementById('mode-overlay');if(!overlay)return;overlay.innerHTML=`<section class="mode-dialog" role="dialog" aria-modal="true" aria-label="Day 학습 방식"><div class="eyebrow">DAY ${String(i+1).padStart(2,'0')}</div><h2>어떤 단어를 복습할까요?</h2><p>아는 단어로 표시하지 않은 단어는 모르는 단어에 포함돼요.</p><div class="mode-options"><button class="mode-option" onclick="startDay(${i},'all')"><b>전체 단어</b><span>${words.length}개</span></button><button class="mode-option" ${known?'':'disabled'} onclick="startDay(${i},'known')"><b>아는 단어만</b><span>${known}개</span></button><button class="mode-option" ${unknown?'':'disabled'} onclick="startDay(${i},'unknown')"><b>모르는 단어만</b><span>${unknown}개</span></button></div><button class="back mode-close" onclick="closeDayMode()">닫기</button></section>`;overlay.hidden=false}
function closeDayMode(){let overlay=document.getElementById('mode-overlay');if(overlay)overlay.hidden=true}function clearCardTimers(){clearTimeout(questionTimer);clearTimeout(answerTimer);questionTimer=null;answerTimer=null}
function saveCurrent(){let p=progress();p.current={day:dayIndex+1,index:cardIndex,order:currentItems.map(x=>x.word),revealed,mode:currentMode};localStorage.setItem(KEY,JSON.stringify(p))}
function setWordStatus(word,status){let p=progress();p.wordStatus=p.wordStatus||{};p.wordStatus[word]=status;localStorage.setItem(KEY,JSON.stringify(p))}
function startDay(i,mode='all'){clearCardTimers();closeDayMode();dayIndex=i;currentMode=mode;let p=progress(),dayWords=D.days[i],saved=p.current?.day===i+1&&(p.current.mode||'all')===mode?p.current:null,byWord=new Map(dayWords.map(x=>[x.word,x])),status=p.wordStatus||{},pool=dayWords.filter(x=>mode==='all'||(mode==='known'?status[x.word]==='known':status[x.word]!=='known'));if(!pool.length)return;if(saved&&saved.order.length&&saved.order.every(w=>byWord.has(w))){currentItems=saved.order.map(w=>byWord.get(w));cardIndex=Math.min(saved.index,currentItems.length-1);revealed=!!saved.revealed}else{currentItems=[...pool];for(let k=currentItems.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[currentItems[k],currentItems[j]]=[currentItems[j],currentItems[k]]}cardIndex=0;revealed=false}study();if(revealed)answerTimer=setTimeout(advanceCard,2000);else questionTimer=setTimeout(revealAnswer,10000);window.scrollTo(0,0)}function study(){page='study';saveCurrent();let list=currentItems,x=list[cardIndex],n=dayIndex+1,pct=(cardIndex+1)/list.length*100;frame(`<section class="view"><div class="study-head"><button class="back" onclick="daysPage()">← Day 목록</button><span>DAY ${String(n).padStart(2,'0')}　·　${cardIndex+1} / ${list.length}</span></div><div class="track"><div class="fill" style="width:${pct}%"></div></div><article class="card"><span class="counter">${String(cardIndex+1).padStart(2,'0')} / ${list.length}</span><div class="flashword">${esc(x.word)}</div>${revealed?`<div class="flashmeaning">${defs(x)}</div><div class="hint">2초 후 자동으로 다음 단어로 넘어갑니다.</div>`:`<div class="hint">10초 안에 알고 있는지 선택해 보세요.</div>`}<div class="card-actions">${revealed?`<button class="btn soft" onclick="advanceCard()">다음 단어 →</button>`:`<button class="btn soft" onclick="markKnown()">아는 단어</button><button class="btn teal" onclick="markUnknown()">모름 · 뜻 보기</button>`}</div></article></section>`)}
function revealAnswer(classification='unknown'){if(revealed||page!=='study')return;clearTimeout(questionTimer);if(classification==='unknown')setWordStatus(currentItems[cardIndex].word,'unknown');revealed=true;study();answerTimer=setTimeout(advanceCard,2000)}
function markKnown(){if(page!=='study')return;setWordStatus(currentItems[cardIndex].word,'known');if(revealed){advanceCard();return}revealAnswer('keep')}
function markUnknown(){if(page!=='study')return;setWordStatus(currentItems[cardIndex].word,'unknown');if(revealed){advanceCard();return}revealAnswer('keep')}
function advanceCard(){clearCardTimers();if(cardIndex+1>=currentItems.length){completeDay();return}cardIndex++;revealed=false;study();questionTimer=setTimeout(revealAnswer,10000)}
function move(delta){if(delta>0){if(!revealed){revealAnswer();return}advanceCard();return}if(cardIndex>0){clearCardTimers();cardIndex--;revealed=false;study();questionTimer=setTimeout(revealAnswer,10000)}}
function completeDay(){clearCardTimers();let p=progress(),date=isoToday(),n=dayIndex+1;p.days=p.days||{};p.days[n]=date;p.last={date,day:n};delete p.current;localStorage.setItem(KEY,JSON.stringify(p));page='complete';frame(`<section class="view"><button class="back" onclick="daysPage()">← Day 목록</button><article class="done-card"><div class="done-icon">✓</div><div class="eyebrow">DAY ${String(n).padStart(2,'0')} COMPLETE</div><h1>오늘 회독 완료!</h1><p>${dateLabel(date)} · Day ${n}<br>${currentItems.length}개 단어를 끝까지 살펴봤어요. 기록은 시작 화면과 Day 목록에 저장됩니다.</p><div class="done-actions"><button class="btn soft" onclick="daysPage()">다른 Day 보기</button><button class="btn" onclick="home()">시작화면</button></div></article></section>`)}
window.addEventListener('keydown',e=>{if(page!=='study')return;if(e.key==='ArrowRight'){e.preventDefault();markUnknown()}else if(e.key==='Enter'){e.preventDefault();markKnown()}else if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}else if(e.key===' '&&!['INPUT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();if(revealed)advanceCard();else markUnknown()}});home();
</script></body></html>
