function frame(s){app.innerHTML=`<header class="top"><div class="brand"><span class="mark">W</span> WORDFLOW</div><div class="tagline">오늘의 단어를 차근차근</div></header><main class="wrap">${s}<div class="footer">학습 기록은 이 브라우저에 저장됩니다.</div></main>`}
function defs(x){return x.defs.map(a=>`<span class="pos ${a.estimated?'guess':''}">${esc(a.pos)}${a.estimated?' · 추정':''}</span> ${a.meanings.map(esc).join(' · ')}`).join('<br>')}
function home(){clearCardTimers();page='home';let p=progress(),last=p.last?`마지막 회독: <b>${dateLabel(p.last.date)} · Day ${p.last.day}</b>`:'아직 회독 기록이 없습니다. Day를 완료하면 여기에 저장됩니다.';frame(`<section class="view"><div class="hero"><div><div class="eyebrow">WORDFLOW · DAILY REVIEW</div><h1>단어를 하나씩,<br>내 것으로.</h1><p>아는 단어는 목록으로 살펴보고, 모르는 단어는 고정된 섞기 순서로 하루씩 복습해요.</p></div><div class="total"><b>${(D.knownCount+D.unknownCount).toLocaleString()}</b><small>전체 단어</small></div></div><div class="choices"><button class="choice" onclick="knownPage()"><span class="icon">✓</span><h2>아는 단어</h2><p>기존에 알고 있는 ${D.knownCount.toLocaleString()}개</p><strong>전체 목록 보기　→</strong></button><button class="choice unknown" onclick="daysPage()"><span class="icon">✦</span><h2>모르는 단어</h2><p>${D.unknownCount.toLocaleString()}개 · 24 Days</p><strong>Day 선택하기　→</strong></button></div><div class="last"><span class="dot"></span><span>${last}</span></div><div class="backup"><div class="backup-copy"><b>복습 기록 백업</b><span>JSON 파일로 내보내 다른 기기에서 가져올 수 있어요.</span></div><div class="backup-actions"><button class="btn soft" onclick="exportProgress()">기록 내보내기</button><button class="btn" onclick="document.getElementById('backup-file').click()">기록 가져오기</button><input class="file-input" id="backup-file" type="file" accept=".json,application/json" onchange="importProgress(this)"></div></div></section>`)}
function knownPage(){clearCardTimers();page='known';query='';frame(`<section class="view"><button class="back" onclick="home()">← 시작화면</button><div class="head"><div><div class="eyebrow">KNOWN WORDS</div><h1>아는 단어</h1><p>기존에 알고 있는 단어를 모두 나열했습니다.</p></div><input class="search" id="search" placeholder="단어 또는 뜻 검색" oninput="updateKnown(this.value)"></div><div class="summary"><span>전체 ${D.knownCount.toLocaleString()}개</span><span id="shown"></span></div><div class="list" id="known-list"></div></section>`);updateKnown('')}
function updateKnown(q){query=q;let list=D.known.filter(x=>!q||x.word.toLowerCase().includes(q.toLowerCase())||x.defs.some(a=>a.meanings.join(' ').toLowerCase().includes(q.toLowerCase())));document.getElementById('shown').textContent=`현재 ${list.length.toLocaleString()}개 표시`;document.getElementById('known-list').innerHTML=list.length?list.map(x=>`<article class="row"><div class="word">${esc(x.word)}</div><div class="meaning">${defs(x)}</div></article>`).join(''):'<div class="empty">검색 결과가 없습니다.</div>'}
function daysPage(){clearCardTimers();page='days';let p=progress();frame(`<section class="view"><button class="back" onclick="home()">← 시작화면</button><div class="head"><div><div class="eyebrow">UNKNOWN WORDS · 24 DAYS</div><h1>모르는 단어</h1><p>단어 순서는 섞어서 고정했습니다. Day 1–23은 100개, Day 24는 ${D.days[23].length}개입니다.</p></div><div class="total"><b>${D.unknownCount.toLocaleString()}</b><small>단어</small></div></div><div class="days">${D.days.map((a,i)=>{let n=i+1,last=p.days?.[n];return `<button class="day" onclick="startDay(${i})"><small>DAY ${String(n).padStart(2,'0')}</small><b>${a.length}개 단어</b><span>${last?'마지막 회독 · '+dateLabel(last):'아직 회독 전'}</span><em>시작하기 →</em></button>`}).join('')}</div></section>`)}
function clearCardTimers(){clearTimeout(questionTimer);clearTimeout(answerTimer);questionTimer=null;answerTimer=null}
function startDay(i){clearCardTimers();dayIndex=i;currentItems=[...D.days[i]];for(let k=currentItems.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[currentItems[k],currentItems[j]]=[currentItems[j],currentItems[k]]}cardIndex=0;revealed=false;study();questionTimer=setTimeout(revealAnswer,10000);window.scrollTo(0,0)}
function study(){page='study';let list=currentItems,x=list[cardIndex],n=dayIndex+1,pct=(cardIndex+1)/list.length*100;frame(`<section class="view"><div class="study-head"><button class="back" onclick="daysPage()">← Day 목록</button><span>DAY ${String(n).padStart(2,'0')}　·　${cardIndex+1} / ${list.length}</span></div><div class="track"><div class="fill" style="width:${pct}%"></div></div><article class="card"><span class="counter">${String(cardIndex+1).padStart(2,'0')} / ${list.length}</span><div class="flashword">${esc(x.word)}</div>${revealed?`<div class="flashmeaning">${defs(x)}</div><div class="hint">2초 후 자동으로 다음 단어로 넘어갑니다.</div>`:`<div class="hint">10초 안에 알고 있는지 선택해 보세요.</div>`}<div class="card-actions">${revealed?`<button class="btn soft" onclick="advanceCard()">다음 단어 →</button>`:`<button class="btn soft" onclick="markKnown()">아는 단어</button><button class="btn teal" onclick="markUnknown()">모름 · 뜻 보기</button>`}</div></article></section>`)}
function revealAnswer(){if(revealed||page!=='study')return;clearTimeout(questionTimer);revealed=true;study();answerTimer=setTimeout(advanceCard,2000)}
function markKnown(){if(page!=='study')return;advanceCard()}
function markUnknown(){if(page!=='study')return;revealAnswer()}
function advanceCard(){clearCardTimers();if(cardIndex+1>=currentItems.length){completeDay();return}cardIndex++;revealed=false;study();questionTimer=setTimeout(revealAnswer,10000)}
function move(delta){if(delta>0){advanceCard();return}if(cardIndex>0){clearCardTimers();cardIndex--;revealed=false;study();questionTimer=setTimeout(revealAnswer,10000)}}
function completeDay(){clearCardTimers();let p=progress(),date=isoToday(),n=dayIndex+1;p.days=p.days||{};p.days[n]=date;p.last={date,day:n};localStorage.setItem(KEY,JSON.stringify(p));page='complete';frame(`<section class="view"><button class="back" onclick="daysPage()">← Day 목록</button><article class="done-card"><div class="done-icon">✓</div><div class="eyebrow">DAY ${String(n).padStart(2,'0')} COMPLETE</div><h1>오늘 회독 완료!</h1><p>${dateLabel(date)} · Day ${n}<br>${currentItems.length}개 단어를 끝까지 살펴봤어요. 기록은 시작 화면과 Day 목록에 저장됩니다.</p><div class="done-actions"><button class="btn soft" onclick="daysPage()">다른 Day 보기</button><button class="btn" onclick="home()">시작화면</button></div></article></section>`)}
window.addEventListener('keydown',e=>{if(page==='study'&&e.key==='ArrowRight')move(1);if(page==='study'&&e.key==='ArrowLeft')move(-1);if(page==='study'&&e.key===' '&&!['INPUT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();if(revealed)advanceCard();else markUnknown()}});home();
</script></body></html>
